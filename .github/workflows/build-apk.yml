name: Build OMG Miner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "ndk;27.2.12479018"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path is missing"
            exit 1
          fi

          NDK_ROOT="${SDK_ROOT}/ndk/27.2.12479018"

          if [ ! -d "$NDK_ROOT" ]; then
            echo "::error::Android NDK installation not found"
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK installation verified"

      - name: Build OpenSSL for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          export PATH="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"

          command -v aarch64-linux-android26-clang
          command -v llvm-ar
          command -v perl
          command -v make

          cd native/openssl

          ./Configure android-arm64 \
            -D__ANDROID_API__=26 \
            no-shared no-tests no-apps \
            --prefix="${RUNNER_TEMP}/omg-openssl-arm64" \
            --libdir=lib

          make -j2 build_libs
          make install_dev

          test -f "${RUNNER_TEMP}/omg-openssl-arm64/lib/libssl.a"
          test -f "${RUNNER_TEMP}/omg-openssl-arm64/lib/libcrypto.a"

          echo "OMG OpenSSL ARM64 build successful"

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMG-Miner-Native-Bridge-Test
          path: app/build/outputs/apk/debug/app-debug.apk
