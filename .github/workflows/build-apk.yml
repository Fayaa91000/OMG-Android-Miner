name: Build OMG Miner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Build OpenSSL for Android ARM64
        shell: bash
        run: |
          set -e

          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/27.2.12479018"
          export PATH="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"

          cd native/openssl

          ./Configure android-arm64 \
            -D__ANDROID_API__=26 \
            no-shared no-tests no-apps \
            --prefix="${RUNNER_TEMP}/omg-openssl-arm64" \
            --libdir=lib

          make -j2 build_libs
          make install_dev

          test -f "${RUNNER_TEMP}/omg-openssl-arm64/lib/libssl.a"
          test -f "${RUNNER_TEMP}/omg-openssl-arm64/lib/libcrypto.a"

          echo "OMG OpenSSL ARM64 build successful"

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OMG-Miner-Native-Bridge-Test
          path: app/build/outputs/apk/debug/app-debug.apk
