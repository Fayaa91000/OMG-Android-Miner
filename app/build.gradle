plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openmininggateway.miner'
    compileSdk 35

    defaultConfig {
        applicationId 'org.openmininggateway.miner'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
